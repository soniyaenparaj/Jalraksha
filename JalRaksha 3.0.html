<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JalRaksha 3.0 – Know where every litre goes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f1f8fa;--cd:#fff;--tx:#0b2545;--mu:#5b7186;--bd:#dbe8ee;--ac:#0e8a96;--ac2:#35c4d8;--nv:#0b2545;--bad:#e0453a;--wr:#f0a021;--ok:#1aa87a;--sh:0 6px 24px rgba(11,37,69,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071622;--cd:#0e2434;--tx:#e6f3f8;--mu:#8fa9ba;--bd:#1f3a4d;--ac:#3cc7d6;--nv:#0a1d2d;--sh:0 6px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#071622;--cd:#0e2434;--tx:#e6f3f8;--mu:#8fa9ba;--bd:#1f3a4d;--ac:#3cc7d6;--nv:#0a1d2d;--sh:0 6px 24px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;letter-spacing:-.02em}
button,select,input,textarea{font:inherit;color:var(--tx)}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--nv);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:#9fc3d3;padding:8px 2px;border-radius:12px;font-size:12px;cursor:pointer;display:grid;gap:2px;justify-items:center}
nav button b{font-size:20px}nav button.on{background:rgba(53,196,216,.18);color:#fff}
.brand,.who{display:none}
main{flex:1;padding:16px 16px 100px;max-width:1100px;margin:0 auto;width:100%}
@media(min-width:860px){nav{position:sticky;top:0;height:100vh;width:250px;flex:none;flex-direction:column;padding:22px 14px;gap:6px}
nav button{display:flex;gap:12px;font-size:15px;padding:12px 14px;text-align:left;align-items:center}
.brand{display:block;color:#fff;font:800 24px 'Bricolage Grotesque';margin:0 8px 18px}.brand small{display:block;font:400 12px Figtree;color:#9fc3d3}
.who{display:block;margin-top:auto;color:#9fc3d3;font-size:13px;padding:8px}.who button{display:inline;padding:0;color:var(--ac2);text-decoration:underline}
main{padding:28px 32px 40px}}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px 24px 70px;color:#fff;background:linear-gradient(135deg,#0b2545,#0e6f8a);box-shadow:var(--sh)}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.1;max-width:20ch}.hero p{color:#cfe9f1;margin:8px 0 0;max-width:46ch}
.wave{position:absolute;left:0;bottom:-2px;width:200%;height:60px;animation:w 9s linear infinite}
@keyframes w{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.wave{animation:none}}
.grid{display:grid;gap:14px;margin-top:16px}.g2{grid-template-columns:repeat(2,1fr)}
@media(min-width:860px){.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2b{grid-template-columns:1fr 1fr}}
.c{background:var(--cd);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.kpi b{display:block;font:700 28px 'Bricolage Grotesque'}.kpi small,.mu{color:var(--mu);font-size:13px}
h2{font-size:20px;margin:22px 0 4px}.sec{color:var(--mu);margin:0 0 10px;font-size:14px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--ac);color:#fff;transition:transform .12s}.btn:hover{transform:translateY(-1px)}
.btn.s{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.pill{display:inline-block;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;background:#e3f4f6;color:#0b6a74}.pill.r{background:#fde6e3;color:#b3281d}.pill.y{background:#fdf0d5;color:#8a5a00}.pill.g{background:#dcf5ea;color:#0f7a56}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{border:1.5px solid var(--bd);background:var(--cd);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:14px}.chip.on{background:var(--nv);color:#fff;border-color:var(--nv)}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:11px 12px;margin:4px 0 12px}
label{font-weight:600;font-size:14px}input[type=range]{padding:0;accent-color:var(--ac)}
.role{cursor:pointer;text-align:left;border:2px solid transparent;font:inherit;color:inherit}.role:hover{border-color:var(--ac2)}.role b{font:700 22px 'Bricolage Grotesque';display:block}
.tl{display:flex;margin:12px 0 4px}.tl i{flex:1;text-align:center;font-style:normal;font-size:11px;color:var(--mu);position:relative}.tl i:before{content:"";display:block;height:10px;width:10px;border-radius:50%;background:var(--bd);margin:0 auto 4px}.tl i.d{color:var(--tx);font-weight:700}.tl i.d:before{background:var(--ok)}
.al{border-left:6px solid var(--bad)}.al.f{border-left-color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:8px 4px;border-top:1px solid var(--bd)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--nv);color:#fff;padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}#toast.on{opacity:1}
canvas{width:100%;height:210px}
</style></head><body>
<div class="app" id="app"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2400)};
/* ---------- Demo water model (simulated; clearly labelled) ---------- */
const DT=1/6,g=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
const Z=[{k:'z1',n:'Hostels',nt:30,p:[[6.5,650,1.7],[21,620,2.3]]},{k:'z2',n:'Canteen & mess',nt:6,p:[[8,260,1.2],[13,560,1.5],[19,320,1.4]]},{k:'z3',n:'Washrooms',nt:5,p:[[10.5,260,1],[13,320,1],[15.5,260,1]]},{k:'z4',n:'Labs & offices',nt:8,p:[[11,200,2.6],[15,180,2.4]]},{k:'z5',n:'Garden & sports',nt:2,p:[[6.3,300,.8],[17.5,280,1]]}];
const prof=(z,h)=>z.nt+z.p.reduce((s,[c,a,w])=>s+a*Math.exp(-(((h-c)/w)**2)),0);
const sdv=(z,h)=>6+.06*prof(z,h);
const daily=Z.reduce((s,z)=>{let a=0;for(let b=0;b<144;b++)a+=prof(z,b/6)*DT;return s+a},0);
const fmt=L=>L>=1000?(L/1000).toFixed(1)+' kL':Math.round(L)+' L';
const S={t:78,leaks:[],inc:[],hist:{},cnt:{},sel:'z1',saved:0,tar:40,dm:[],dz:[]};
Z.forEach(z=>{S.hist[z.k]=[];S.cnt[z.k]=0});
const rs=L=>'₹'+Math.round(L/1000*S.tar).toLocaleString('en-IN');
const clk=t=>{const b=t%144;return String(Math.floor(b/6)).padStart(2,'0')+':'+String((b%6)*10).padStart(2,'0')};
function tick(){const h=(S.t%144)/6;let sum=0,loss=0;
Z.forEach(z=>{const e=prof(z,h);let x=Math.max(0,e*(1+.06*g())+2*g());S.leaks.forEach(l=>{if(l.z==z.k)x+=l.rate*(1+.03*g())});sum+=x;
const d=x-e,hit=d/sdv(z,h)>4.5&&d>35;S.cnt[z.k]=hit?S.cnt[z.k]+1:0;
if(S.cnt[z.k]==3&&!S.inc.some(i=>i.z==z.k&&i.st!='fixed'))S.inc.unshift({id:'A-'+(100+S.inc.length+1),z:z.k,nm:z.n,rate:d,sc:d/sdv(z,h),exp:e,act:x,td:S.t,st:'new',lost:0});
const H=S.hist[z.k];H.push({a:x,e,f:S.cnt[z.k]>0});if(H.length>72)H.shift()});
S.leaks.forEach(l=>l.lost+=l.rate*DT);S.inc.forEach(i=>{if(i.st!='fixed')i.lost+=i.rate*DT});
S.dz.push(sum);S.dm.push(sum+S.leaks.filter(l=>l.main).reduce((s,l)=>s+l.rate,0)+6*g());if(S.dz.length>144){S.dz.shift();S.dm.shift()}S.t++}
for(let i=0;i<72;i++)tick();
/* ---------- Complaints (saved in this browser) ---------- */
const STEPS=['Submitted','Verified','Assigned','In progress','Resolved'],TYPES=['💧 Leaking tap or pipe','🚽 Running toilet','🌊 Overflowing tank','🟤 Dirty water','🚫 No water supply','❓ Something else'];
let C=ST('jr_c')||[],role=ST('jr_role'),pg=null;
const NAV={manager:[['home','🏠','Overview'],['alerts','🚨','Leak alerts'],['reports','📣','Complaints'],['plan','🌧️','Plan & savings']],community:[['report','✍️','Report a problem'],['track','🔎','My reports'],['tips','💡','Save water']]};
const nextLbl=['Verify it’s real','Create work order','Start work','Mark resolved'];
function go(p){pg=p;draw()}
function draw(){
if(!role){$('#app').innerHTML=`<main style="max-width:760px;display:grid;align-content:center;min-height:100vh"><div class="hero"><h1>💧 JalRaksha</h1><p>Find leaks early, fix problems fast and prove the water you save. Pick who you are to begin.</p><svg class="wave" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30Q150 0 300 30T600 30T900 30T1200 30V60H0Z" fill="var(--bg)"/></svg></div>
<div class="grid g2b"><button class="c role" data-r="manager"><b>🧑‍💼 Facility Manager</b><span class="mu">Watch water use, get leak alerts, assign repairs and plan savings.</span></button><button class="c role" data-r="community"><b>🙋 Student / Resident</b><span class="mu">Report a leak in under a minute and follow it until it’s fixed.</span></button></div>
<p class="mu" style="text-align:center">Demo mode: water readings are <b>simulated</b>, not real campus data.</p></main>`;
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{role=b.dataset.r;SV('jr_role',role);go(NAV[role][0][0])});return}
if(!pg||!NAV[role].some(n=>n[0]==pg))pg=NAV[role][0][0];
$('#app').innerHTML=`<nav aria-label="Main"><div class="brand">💧 JalRaksha<small>Demo • simulated data</small></div>${NAV[role].map(n=>`<button data-p="${n[0]}" class="${n[0]==pg?'on':''}"><b>${n[1]}</b>${n[2]}</button>`).join('')}<div class="who">${role=='manager'?'🧑‍💼 Facility Manager':'🙋 Community user'}<br><button id="sw">Switch role</button></div></nav><main id="m"></main>`;
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));$('#sw').onclick=()=>{role=null;SV('jr_role',null);draw()};
$('#m').innerHTML=VIEW[pg]();bind();upd()}
const open=()=>S.inc.filter(i=>i.st!='fixed'),act=()=>C.filter(c=>c.s<4);
function tl(c){return `<div class="tl">${STEPS.map((s,i)=>`<i class="${i<=c.s?'d':''}">${s}</i>`).join('')}</div>`}
const VIEW={
home(){const o=open(),r=o.reduce((s,i)=>s+i.rate,0);return `<div class="hero"><h1>${o.length?`⚠️ ${o.length} possible leak${o.length>1?'s':''} costing about ${rs(r*720)} a month`:'✅ All clear. No leaks need attention.'}</h1><p>${o.length?'Open Leak alerts to inspect and fix it.':'Water use matches what is normal for this time of day.'}</p><svg class="wave" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30Q150 0 300 30T600 30T900 30T1200 30V60H0Z" fill="var(--bg)"/></svg></div>
<div class="grid g2 g4" id="kp"></div>
<h2>Live water flow</h2><p class="sec">Solid line = actual litres per hour. Dashed = expected for this hour. Red = unusually high. Tap an area to switch.</p><div class="c"><div class="chips">${Z.map(z=>`<button class="chip ${S.sel==z.k?'on':''}" data-z="${z.k}">${z.n}</button>`).join('')}</div><canvas id="cv" aria-label="Flow chart"></canvas></div>
<h2>Try the demo</h2><p class="sec">Simulate a hidden leak and watch JalRaksha catch it. Data source: simulated.</p><div class="c"><select id="zs" aria-label="Area">${Z.map(z=>`<option value="${z.k}">${z.n}</option>`).join('')}</select><button class="btn" id="inj">💥 Start a hidden leak</button></div>`},
alerts(){return `<h1>🚨 Leak alerts</h1><p class="sec">JalRaksha compares each area’s flow with what is normal at that hour. A flag means <b>possible</b> leak. It is confirmed only after inspection.</p><div id="al"></div>`},
reports(){return `<h1>📣 Complaints</h1><p class="sec">Problems reported by students and residents. Move each one forward until it is resolved.</p><div id="cl"></div>`},
plan(){return `<h1>🌧️ Plan & savings</h1><p class="sec">Estimates only. Change the numbers to match your campus.</p>
<div class="grid g2b"><div class="c"><h3>Rainwater harvesting</h3><label>Roof area: <span id="va"></span> m²</label><input id="wa" type="range" min="0" max="5000" step="100" value="1500"><label>Annual rainfall (mm)</label><input id="wr" type="number" value="970" min="0"><p class="mu">Entered by hand. Default ≈ long-term Bengaluru average, please check IMD or Open-Meteo for your site.</p><div id="rw"></div><p class="mu">Formula: roof area × rainfall × 0.8 runoff × 0.9 after first-flush loss. Real collection depends on tank size and rain pattern.</p></div>
<div class="c"><h3>Other savings</h3><label>Low-flow taps and flushes: <span id="vf"></span> less use</label><input id="wf" type="range" min="0" max="30" value="15"><label>Greywater reuse: <span id="vg"></span> of bathing/washing use</label><input id="wg" type="range" min="0" max="40" value="15"><div id="ow"></div></div></div>
<h2>If the water supply stops</h2><p class="sec">How long will stored water last?</p><div class="c"><div class="grid g2b" style="margin:0"><div><label>Tank storage (kL)</label><input id="tc" type="number" value="200" min="0"><label>Currently full: <span id="vt"></span></label><input id="tl" type="range" min="0" max="100" value="70"></div><div><label>Essential-only use: <span id="ve"></span> of normal</label><input id="te" type="range" min="20" max="100" value="50"><div id="sh"></div></div></div></div>`},
report(){return `<h1>✍️ Report a problem</h1><p class="sec">Takes under a minute. We’ll send it to the facility manager.</p><div class="c"><label>What’s wrong?</label><select id="ct">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select><label>Where?</label><select id="cz">${Z.map(z=>`<option>${z.n}</option>`).join('')}</select><label>Tell us more (optional)</label><textarea id="cd" rows="3" placeholder="e.g. 2nd floor washroom, tap running all night"></textarea><button class="btn" id="sub">Send report</button></div>`},
track(){return `<h1>🔎 My reports</h1><p class="sec">Follow each report from submitted to resolved.</p><div id="cl"></div>`},
tips(){const t=[['🚿','Keep showers under 5 minutes','Saves up to 40 litres each time.'],['🚰','Close taps fully','A dripping tap wastes about 10 litres a day.'],['🚽','Listen for running toilets','A stuck cistern can lose 150+ litres an hour. Report it.'],['🪥','Turn off the tap while brushing','Saves around 6 litres a minute.'],['🌱','Water gardens early morning','Less evaporation, healthier plants.']];return `<h1>💡 Save water</h1><p class="sec">Small habits add up across a whole campus.</p><div class="grid g2b">${t.map(x=>`<div class="c"><h3>${x[0]} ${x[1]}</h3><p class="mu">${x[2]}</p></div>`).join('')}</div>`}};
function bind(){
const q=(s,f)=>{const e=$(s);if(e)f(e)};
document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.z;draw()});
q('#inj',b=>b.onclick=()=>{const z=$('#zs').value;if(S.leaks.some(l=>l.z==z))return toast('A leak is already running there');S.leaks.push({z,rate:260+Math.random()*120|0,lost:0});toast('Leak started. Alert in about 30 simulated minutes.')});
q('#sub',b=>b.onclick=()=>{const d=$('#cd').value.trim(),n=1001+C.length;C.unshift({id:'C-'+n,ty:$('#ct').value,loc:$('#cz').value,d,s:0,log:[['Submitted',new Date().toLocaleString('en-IN')]]});SV('jr_c',C);toast('Report C-'+n+' sent ✅');go('track')});
['wa','wr','wf','wg','tc','tl','te'].forEach(i=>q('#'+i,e=>e.oninput=upd))}
function cardC(c){const m=role=='manager',nx=nextLbl[c.s];return `<div class="c" style="margin-bottom:12px"><b>${c.ty}</b> <span class="pill ${c.s==4?'g':c.s>1?'y':''}">${STEPS[c.s]}</span><div class="mu">${c.id} • ${esc(c.loc)}${c.d?' • “'+esc(c.d)+'”':''}${c.wo?' • '+c.wo:''}</div>${tl(c)}<div class="mu">Latest: ${c.log[c.log.length-1][0]}, ${c.log[c.log.length-1][1]}</div><div style="margin-top:10px">${m&&nx?`<button class="btn" data-c="${c.id}">${nx}</button>`:''}${!m&&c.s==4?`<button class="btn s" data-re="${c.id}">Still not fixed? Reopen</button>`:''}</div></div>`}
function upd(){
const set=(id,h)=>{const e=$(id);if(e&&e._h!==h){e._h=h;e.innerHTML=h}};
if(pg=='home'){const m=S.dm.reduce((a,b)=>a+b,0),z=S.dz.reduce((a,b)=>a+b,0),u=Math.max(0,(m-z)/m*100),k=(t,v,s)=>`<div class="c kpi"><small>${t}</small><b>${v}</b><small>${s}</small></div>`;
set('#kp',k('Unaccounted water',u.toFixed(1)+'%','Main meter minus area meters, last 24 h. Simulated.')+k('Open leak alerts',open().length,'Possible leaks to check')+k('Water saved',fmt(S.saved),'Measured, after verified repairs')+k('Open complaints',act().length,'From students and residents'));drawChart()}
if(pg=='alerts')set('#al',S.inc.length?S.inc.map(i=>{const f=i.st=='fixed',H=S.hist[i.z],l=H[H.length-1],sv=i.sv||0;return `<div class="c al ${f?'f':''}" style="margin-bottom:14px"><b style="font-size:18px">${f?'✅ Repaired':'🚨 Possible hidden leak'}: ${i.nm}</b> <span class="pill ${f?'g':i.rate>300?'r':'y'}">${f?'Verified fixed':i.rate>300?'High severity':'Medium severity'}</span><div class="mu">${i.id} • detected ${clk(i.td)} (simulated) • ${i.st=='wo'?'Work order '+i.wo:''}</div>
<table><tr><td>Expected normal</td><td><b>${Math.round(i.exp)} L/h</b></td></tr><tr><td>Actual flow</td><td><b>${Math.round(i.act)} L/h</b> (${i.sc.toFixed(1)}× normal variation above expected)</td></tr><tr><td>Extra flow</td><td><b>+${Math.round(i.rate)} L/h</b> ≈ ${rs(i.rate*720)} a month</td></tr><tr><td>Lost so far</td><td><b>${fmt(i.lost)}</b> (${rs(i.lost)}), from meter readings</td></tr></table>
${f?`<p>🔧 Verification: flow now ${Math.round(l.a)} L/h vs ${Math.round(l.e)} expected. Projected saving if left a month: <b>${fmt(i.rate*720)}</b> <span class="mu">(estimate)</span></p>`:`<p class="mu">Possible causes: leaking pipe, running toilet, stuck valve. <b>Not confirmed</b> until someone inspects.</p>${i.st=='new'?`<button class="btn" data-a="wo" data-i="${i.id}">Create work order</button>`:`<button class="btn" data-a="fix" data-i="${i.id}">Mark repaired</button>`}`}</div>`}).join(''):'<div class="c">🎉 No alerts yet. Open Overview and start a hidden leak to see how detection works.</div>');
if(pg=='reports'||pg=='track')set('#cl',C.length?C.map(cardC).join(''):`<div class="c">${role=='manager'?'📭 No complaints yet. Switch role to Student and submit one to see the full flow.':'📭 You haven’t reported anything yet. Spotted a leak? Tap “Report a problem”.'}</div>`);
if(pg=='plan'){const v=id=>+$(id).value,D=daily*365,f=v('#wf'),a=v('#wa'),r=v('#wr')||0,gr=v('#wg'),W=Z[0].nt?0:0;
$('#va').textContent=a;$('#vf').textContent=f+'%';$('#vg').textContent=gr+'%';$('#vt').textContent=v('#tl')+'%';$('#ve').textContent=v('#te')+'%';
const rain=a*r*.8*.9,fix=D*f/100,gw=daily*.3*365*gr/100,row=(n,x)=>`<tr><td>${n}</td><td><b>${fmt(x)}/yr</b></td><td>${rs(x)}</td></tr>`;
$('#rw').innerHTML=`<div class="kpi"><b>${fmt(rain)}</b><small>per year if every drop is stored (${rs(rain)})</small></div>`;
$('#ow').innerHTML=`<table>${row('Low-flow fittings',fix)}${row('Greywater reuse',gw)}${row('Rainwater',rain)}<tr><td><b>Total</b></td><td><b>${fmt(Math.min(rain+fix+gw,D*.9))}</b></td><td><b>${(Math.min(rain+fix+gw,D*.9)/D*100).toFixed(0)}%</b> of use</td></tr></table><p class="mu">Estimates, not measured savings. Greywater assumed ≈30% of daily use.</p>`;
const st=v('#tc')*1000*v('#tl')/100,d1=st/daily,d2=st/(daily*v('#te')/100),c=d2<1?'r':d2<3?'y':'g';
$('#sh').innerHTML=`<p>Normal use: <b>${d1.toFixed(1)} days</b></p><p>Essential only: <span class="pill ${c}">${d2.toFixed(1)} days</span></p><p class="mu">${d2<1?'Severe: arrange emergency tankers now.':d2<3?'Tight: book tankers and restrict non-essential use.':'Comfortable, but keep monitoring.'} Based on ${fmt(daily)}/day simulated demand.</p>`}}
function drawChart(){const c=$('#cv');if(!c)return;const x=c.getContext('2d'),r=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;if(!W)return;c.width=W*r;c.height=H*r;x.setTransform(r,0,0,r,0,0);
const d=S.hist[S.sel],mx=Math.max(60,...d.map(p=>Math.max(p.a,p.e)))*1.1,L=40,B=20,w=W-L-8,h=H-B-6,X=i=>L+i/71*w,Y=v=>6+h-v/mx*h,cs=getComputedStyle(document.documentElement),C2=n=>cs.getPropertyValue(n).trim();
x.font='11px Figtree';x.fillStyle=C2('--mu');x.strokeStyle=C2('--bd');for(let i=0;i<=4;i++){const y=Y(mx*i/4);x.beginPath();x.moveTo(L,y);x.lineTo(W-8,y);x.stroke();x.fillText(Math.round(mx*i/4),4,y+4)}
x.fillStyle='rgba(224,69,58,.2)';d.forEach((p,i)=>p.f&&x.fillRect(X(i)-3,6,6,h));
const ln=k=>{x.beginPath();d.forEach((p,i)=>i?x.lineTo(X(i),Y(p[k])):x.moveTo(X(i),Y(p[k])));x.stroke()};
x.setLineDash([5,4]);x.strokeStyle=C2('--mu');ln('e');x.setLineDash([]);x.lineWidth=2.5;x.strokeStyle=C2('--ac');ln('a');x.fillStyle=C2('--mu');x.fillText('12 h ago',L,H-4);x.textAlign='right';x.fillText('now',W-8,H-4);x.textAlign='left'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.c){const c=C.find(z=>z.id==b.dataset.c);c.s++;if(c.s==2)c.wo='WO-'+(2000+C.indexOf(c));c.log.push([STEPS[c.s],new Date().toLocaleString('en-IN')]);SV('jr_c',C);toast(c.id+' → '+STEPS[c.s]);pg=='reports'&&(delete $('#cl')._h,upd())}
if(b.dataset.re){const c=C.find(z=>z.id==b.dataset.re);c.s=0;c.log.push(['Reopened',new Date().toLocaleString('en-IN')]);SV('jr_c',C);toast('Reopened for review');delete $('#cl')._h;upd()}
if(b.dataset.a){const i=S.inc.find(z=>z.id==b.dataset.i);if(b.dataset.a=='wo'){i.st='wo';i.wo='WO-'+(3000+S.inc.indexOf(i));toast(i.wo+' created')}else{i.st='fixed';i.sv=1;S.saved+=i.rate*720;S.leaks=S.leaks.filter(l=>l.z!=i.z);toast('Marked repaired. Check the verification reading.')}delete $('#al')._h;upd()}});
setInterval(()=>{tick();upd()},500);window.onresize=()=>pg=='home'&&drawChart();
draw();
</script></body></html>
